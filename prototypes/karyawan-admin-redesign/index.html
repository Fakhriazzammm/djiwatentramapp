<style>

:root{--bg:#f4f4f5;--panel:#fff;--soft:#fafafa;--line:#e4e4e7;--line2:#d4d4d8;--ink:#18181b;--mute:#71717a;--faint:#a1a1aa;--brand:#0b6bb0;--brand-s:#e8f0fb;--red:#d92d20;--ok:#15803d;--ok-s:#e3f4e8;--warn:#a16207;--warn-s:#fdf3d8;--bad:#c2332a;--bad-s:#fdeceb;--font:"Inter",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}

*{box-sizing:border-box}body{margin:0;background:var(--panel);color:var(--ink);font-family:var(--font);font-size:14px}

.pr{padding:12px 22px}.pr .l{display:flex;justify-content:space-between;margin-bottom:8px}.pr .l span{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--mute)}.pb{height:8px;background:var(--line)}.pb i{display:block;height:100%;background:var(--brand)}.pb i.g{background:var(--ok)}.pb i.w{background:#d49a1a}.pb i.r{background:var(--red)}

.stp{display:flex;border:1px solid var(--line);background:var(--panel);margin-bottom:16px}.stp div{flex:1;padding:14px 18px;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);border-left:1px solid var(--line)}.stp div:first-child{border:0}.stp .d{color:var(--ok)}.stp .c{background:#18181b;color:#fff}
