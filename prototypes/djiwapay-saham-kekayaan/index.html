<style>

.gold{width:62px;height:76px;border-radius:8px;background:linear-gradient(160deg,#cdb6c9,#9b6a8f);display:flex;align-items:center;justify-content:center;box-shadow:0 5px 10px rgba(60,20,50,.3)}.gold i{width:12px;height:22px;background:linear-gradient(#f3d16a,#c99a1c);border-radius:2px}

.photo{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:linear-gradient(180deg,#d9552a,#b83f17);color:#fff;font-weight:700;font-size:14px;padding:12px 18px;box-shadow:0 10px 22px rgba(201,70,27,.4);white-space:nowrap;transition:transform .15s}.photo:active{transform:scale(.95)}

.tabbar .p div{flex:1;text-align:center;font-size:10.5px;font-weight:700;color:var(--ink);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}.tabbar .p div.on{background:#efe9dc}.tabbar b{font-size:20px;line-height:1}
.catat{width:68px;height:68px;border-radius:50%;background:linear-gradient(160deg,#4a423a,#241f1a);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.3)}.catat b{font-size:22px;color:#f1c24a;line-height:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:99px;background:var(--ink);color:#fff;font-weight:700;font-size:15px;transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.acc{background:linear-gradient(180deg,#d9552a,#b83f17)}.btn.soft{background:#efe8d8;color:var(--ink)}.btn[disabled]{opacity:.35;pointer-events:none}
.row{display:flex;align-items:center;gap:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}.chip.ok{background:var(--oksoft);color:var(--ok)}.chip.warn{background:var(--warnsoft);color:var(--warn)}.chip.bad{background:var(--badsoft);color:var(--bad)}.chip.gray{background:#efe8d8;color:var(--mute)}
.note{display:flex;gap:8px;align-items:flex-start;background:var(--warnsoft);border-radius:14px;padding:10px 12px;font-size:12.5px;color:#6b4a00;line-height:1.4;animation:up .4s var(--ease)}.note.info{background:var(--accsoft);color:#8a3414}
.note button{margin-left:auto;font-weight:800;text-decoration:underline;white-space:nowrap}
.field{display:block;background:#f4eee0;border-radius:20px;padding:11px 15px;margin-bottom:10px;transition:box-shadow .2s}.field:focus-within{box-shadow:0 0 0 2px rgba(201,70,27,.35)}.field .l{display:block;font-size:11px;font-weight:700;color:var(--mute);margin-bottom:2px}.field input{font-size:22px;font-weight:800}.field .u{font-size:13px;color:var(--mute);font-weight:600}
.steps{display:flex;gap:6px;margin:4px 0 14px}.steps i{flex:1;height:4px;border-radius:9px;background:#e8dfcc}.steps i.on{background:var(--acc)}
.sw{display:flex;background:#f1eadb;border-radius:99px;padding:3px;margin-bottom:12px}.sw button{flex:1;padding:9px;border-radius:99px;font-weight:700;font-size:13px;color:var(--mute);transition:.25s}.sw button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}.sw button.on.buy{color:var(--ok)}.sw button.on.sell{color:var(--bad)}
.list button{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.mini{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;color:#fff;flex:none}
.check{display:flex;gap:10px;font-size:13px;line-height:1.4;margin:9px 0}.check b.t{width:20px;height:20px;border-radius:50%;background:var(--oksoft);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:11px;flex:none;margin-top:1px}.check b.x{background:var(--badsoft);color:var(--bad)}
.prog{display:flex;gap:11px;align-items:center;padding:9px 0;font-size:14px;font-weight:600;opacity:.35;transition:.4s}.prog.on{opacity:1}.prog i{width:22px;height:22px;border-radius:50%;border:2px solid #ddd4c2;display:flex;align-items:center;justify-content:center;font-size:11px;font-style:normal;flex:none}.prog.done i{background:var(--ok);border-color:var(--ok);color:#fff}.prog.on:not(.done) i{border-color:var(--acc);border-top-color:transparent;animation:spin .8s linear infinite}
.over{position:absolute;inset:0;background:rgba(36,31,26,.4);z-index:30;display:flex;align-items:flex-end;animation:fade .25s}
.sheet{background:#fff;border-radius:32px 32px 0 0;width:100%;padding:10px 20px 28px;animation:sheetin .45s var(--ease)}@keyframes sheetin{from{transform:translateY(100%)}}
.grab{width:40px;height:5px;border-radius:9px;background:#ddd4c2;margin:0 auto 12px}
.toast{position:absolute;left:18px;right:18px;bottom:100px;background:var(--ink);color:#fff;border-radius:18px;padding:12px 15px;font-size:13px;z-index:40;animation:up .35s var(--ease)}
.gs{font-size:11px;background:#fff;min-height:100%}.gs .bar2{background:#f1f3f4;padding:9px 12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #dadce0}.gs .fx{display:flex;border-bottom:1px solid #dadce0;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;padding:6px 10px;gap:8px;color:#3c4043;min-height:28px;overflow:hidden;white-space:nowrap}
.gs table{border-collapse:collapse;width:max-content;min-width:100%}.gs td,.gs th{border:1px solid #e1e3e6;padding:5px 8px;white-space:nowrap;font-size:11px}.gs th{background:#f8f9fa;font-weight:600;color:#5f6368;text-align:center}.gs td.r{text-align:right;font-variant-numeric:tabular-nums}.gs .h td{background:#fbf6ec;font-weight:700}.gs td.f{background:#eef4ff;cursor:pointer}.gs td.sel{outline:2px solid #1a73e8;outline-offset:-2px}
.gs .tabs{position:absolute;bottom:0;left:0;right:0;background:#f1f3f4;border-top:1px solid #dadce0;display:flex;gap:2px;padding:6px 8px 26px;z-index:5}.gs .tabs button{padding:6px 12px;border-radius:6px 6px 0 0;font-size:11px;font-weight:600;color:#5f6368}.gs .tabs button.on{background:#fff;color:#1a73e8;box-shadow:inset 0 -2px #1a73e8}
.notes{position:sticky;top:16px}.nt{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;font-size:13px;line-height:1.55;animation:up .4s var(--ease)}.nt h3{margin:0 0 6px;font-size:14px}.nt ul{margin:6px 0 0;padding-left:18px;color:var(--mute)}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--accsoft);color:var(--acc);margin-bottom:6px}
</style>

<body>
<div class="stage">
  <aside class="side">
    <h1>Saham di Kekayaan</h1>
    <p class="sub">Versi 2: Saham menjadi tab di halaman Kekayaan yang sudah ada (djiwapay.web.id/kekayaan), memakai rak stiker, kartu nilai, dan tombol melayang yang sama. Data contoh.</p>
    <div class="flow" id="flow"></div>
    <div class="states">
      <h4>Kondisi harga</h4><div class="chips" id="stPrice"></div>
      <h4 style="margin-top:12px">Google Sheets Pay</h4><div class="chips" id="stGoogle"></div><h4 style="margin-top:12px">Isi tab Aset, Dompet, Kewajiban</h4><div class="chips" id="stEmpty"></div>
    </div>
  </aside>
  <main><div class="phone"><div class="notch"></div><div class="status"><span>09:41</span><span>●●● 5G ▮</span></div><div id="scr"></div><div id="over"></div></div></main>
  <aside class="notes" id="notes"></aside>
</div>
<script>
const $=s=>document.querySelector(s);
const rp=n=>"Rp"+Math.round(n).toLocaleString("id-ID");
const rps=n=>(n>=0?"+":"−")+"Rp"+Math.abs(Math.round(n)).toLocaleString("id-ID");
const pc=n=>(n>=0?"▲ ":"▼ ")+Math.abs(n).toFixed(1).replace(".",",")+"%";
const TICK={BBCA:["Bank Central Asia","#1a5dc6"],BBRI:["Bank Rakyat Indonesia","#1c7ed6"],BMRI:["Bank Mandiri","#2b6cb0"],TLKM:["Telkom Indonesia","#c9461b"],ASII:["Astra International","#5b6b7f"],UNVR:["Unilever Indonesia","#2f7d6d"],ICBP:["Indofood CBP","#a05d00"],GOTO:["GoTo Gojek Tokopedia","#4f7a2b"],ANTM:["Aneka Tambang","#8a6d1d"],ADRO:["Alamtara Minerals","#6a4c93"],BBNI:["Bank Negara Indonesia","#d9480f"],KLBF:["Kalbe Farma","#37803f"]};
const PRICE={BBCA:9725,BBRI:4310,BMRI:5120,TLKM:3290,ASII:5275,UNVR:1980,ICBP:11250,GOTO:58,ANTM:1680,ADRO:2470,BBNI:4890,KLBF:1520};
const FEE={buy:.15,sell:.35};
const BASE_NET=-65993592, GOLD=2192572, GOLD_COST=1800000;
const S={empty:false,screen:"vault",tab:"aset",sub:"hold",price:"live",google:true,activated:false,googleBase:false,manual:{},built:0,sel:"BBCA",
 trades:[],add:{},sheetTab:"Saham",cell:null,shownNet:BASE_NET};
const seed=()=>[{t:"BBCA",side:"buy",lots:10,price:9200,at:"04 Agu 2026"},{t:"TLKM",side:"buy",lots:15,price:3420,at:"19 Agu 2026"},{t:"ASII",side:"buy",lots:10,price:5100,at:"11 Sep 2026"},{t:"GOTO",side:"buy",lots:200,price:64,at:"28 Sep 2026"},{t:"BBCA",side:"buy",lots:10,price:9700,at:"02 Okt 2026"}];
const hasStocks=()=>S.activated&&S.trades.length>0;

function priceOf(t){if(S.price==="na"&&t==="GOTO")return S.manual[t]??null;return PRICE[t]??null}
function holdings(){
  const m={};
  S.trades.forEach(x=>{const h=m[x.t]??={t:x.t,sh:0,cost:0,real:0};const sh=x.lots*100;
    if(x.side==="buy"){h.cost+=sh*x.price;h.sh+=sh}else{const avg=h.cost/h.sh;h.real+=sh*(x.price-avg);h.cost-=avg*sh;h.sh-=sh}});
  return Object.values(m).filter(h=>h.sh>0).map(h=>{
    const avg=h.cost/h.sh;let p=S.google?priceOf(h.t):null;const manual=S.google&&p==null;
    if(p==null)p=avg;const value=h.sh*p;
    return{...h,avg,p,value,pl:value-h.cost,plp:h.cost?(value-h.cost)/h.cost*100:0,manual};});
}
const tot=h=>({cost:h.reduce((a,x)=>a+x.cost,0),value:h.reduce((a,x)=>a+x.value,0)});
const stockValue=()=>{const h=holdings();return S.google?tot(h).value:tot(h).cost};

const STEPS=[
 ["vault","Kekayaan · tab Aset","1"],["saham0","Tab Saham (belum aktif)","2"],["consent","Izin Google (hanya jika belum)","3"],["build","Mengaktifkan di spreadsheet","4"],
 ["saham","Tab Saham (portofolio)","5"],["detail","Detail saham","6"],["add","Catat saham","7"],["sheet","Lihat di Google Sheets","8"],["fee","Pengaturan fee broker","9"]];
const NOTES={
 vault:["Integrasi di halaman yang sama","Saham jadi tab keempat di kontrol segmen, tepat setelah Aset. Urutan tab: Aset, Saham, Dompet, Kewajiban. Tiap tab yang masih kosong menampilkan kartu onboarding yang sama polanya (ganti 'Isi tab' di kiri ke Kosong). Setelah aktif, nilai saham ikut ke Kekayaan bersih dan ke komposisi di 'Nilai semua aset'.",["Titik oranye kecil pada tab Saham mengajak mencoba.","Bandingkan angka Kekayaan bersih sebelum dan sesudah fitur aktif."]],
 saham0:["Kondisi kosong: Google yang sudah terhubung dipakai ulang","Pengguna yang sudah menghubungkan Google Sheets untuk Catatan tidak diminta izin lagi. Satu tombol 'Aktifkan Saham' menambah dua tab ke spreadsheet yang sama. Layar izin hanya muncul bagi yang belum pernah menghubungkan (ganti 'Google Sheets Pay' di kiri ke Belum terhubung).",["Pengecualian: bila koneksi lama hanya punya izin Kalender dan belum izin Drive, tetap muncul satu layar izin tambahan.","Pengguna juga bisa memilih mencatat dulu tanpa harga otomatis."]],
 consent:["Persetujuan sederhana (hanya untuk yang belum terhubung)","Pola yang sama dengan integrasi Google Pay lain: yang bisa dan tidak bisa dilakukan, lalu layar Google. Scope hanya drive.file. Pengguna yang Google-nya sudah terhubung tidak melihat layar ini.",[]],
 build:["Mengaktifkan di spreadsheet","Tab Saham dan Portofolio Saham ditambahkan ke spreadsheet keuangan yang sudah ada. Tidak ada file kedua, dan data Catatan tidak tersentuh.",[]],
 saham:["Saham sebagai rak stiker","Setiap saham adalah 'stiker' di rak yang sama dengan aset foto, dengan nilai dan persen untung/rugi di bawahnya. Ketuk untuk detail.",["Kartu 'Nilai semua saham' memakai pola kartu 'Nilai semua aset'.","Riwayat dan pengaturan fee ada di tab ini.","Ganti 'Kondisi harga' di kiri untuk harga basi atau ticker tanpa data."]],
 detail:["Detail saham","Rata-rata beli, lot, untung/rugi belum dan sudah terealisasi, dan riwayat. Harga manual bisa diubah bila Google tidak punya data.",[]],
 add:["Catat saham","Tiga langkah: pilih saham, isi lot dan harga, konfirmasi. Fee mengikuti pengaturan broker. Setelah disimpan, baris langsung ditulis ke tab Saham di spreadsheet.",["Jual melebihi kepemilikan ditolak."]],
 sheet:["Sheet yang sama","Tombol 'Buka di Google Sheets' membuka spreadsheet keuangan. Ketuk sel biru untuk melihat rumus GOOGLEFINANCE.",["Edit dua arah dari sheet menyusul di rilis berikutnya."]],
 fee:["Fee broker","Default beli 0,15% dan jual 0,35% (sudah termasuk pajak). Bisa diubah sesuai broker pengguna, dan berlaku untuk transaksi berikutnya.",[]]};

function renderSide(){
  let h="<h4>Alur</h4>";STEPS.forEach(([k,l,n])=>h+=`<button class="${curStep()===k?"on":""}" onclick="jump('${k}')"><i>${n}</i>${l}</button>`);

  <label class="field"><span class="l">Jumlah lot ${a.side==="sell"?`· punya ${held} lot`:""}</span><div class="row"><input inputmode="numeric" placeholder="0" value="${a.lots}" oninput="S.add.lots=this.value.replace(/\\D/g,'');calc()"><span class="u">lot</span></div></label>
  <label class="field"><span class="l">Harga per lembar</span><div class="row"><span class="u">Rp</span><input inputmode="numeric" placeholder="0" value="${a.price}" oninput="S.add.price=this.value.replace(/\\D/g,'');calc()"></div></label>
  <div class="chips" style="margin:0 0 12px">${[1,5,10,20].map(n=>`<button style="background:#efe8d8;padding:7px 14px;border-radius:99px;font-weight:700;font-size:13px" onclick="S.add.lots='${n}';draw()">${n} lot</button>`).join("")}</div>
  <div class="group" id="sum">${sumHTML(a,gross,fee,net,over)}</div><div style="height:14px"></div><button class="btn acc" id="go2" ${lots>0&&price>0&&!over?"":"disabled"} onclick="S.add.step=3;draw()">Lanjut</button></div>`}
 if(a.step===3){const lots=+a.lots,price=+a.price,gross=lots*100*price,fee=gross*FEE[a.side]/100,net=a.side==="buy"?gross+fee:gross-fee;
  return `<div class="top"><button class="ib" onclick="S.add.step=2;draw()">←</button><h2>Konfirmasi</h2></div><div class="pad" style="padding-bottom:40px"><div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i></div>
  <div class="group"><div class="row" style="margin-bottom:12px">${mini(a.t,46)}<div style="flex:1"><b>${a.t}</b><div class="subt">${TICK[a.t][0]}</div></div><span class="chip ${a.side==="buy"?"ok":"bad"}">${a.side==="buy"?"Beli":"Jual"}</span></div>
  ${[["Tanggal","Hari ini, 19 Nov 2026"],["Jumlah",`${lots} lot (${lots*100} lembar)`],["Harga",rp(price)],["Nilai transaksi",rp(gross)],[`Fee ${FEE[a.side].toString().replace(".",",")}%`,rp(fee)]].map(([k,v])=>`<div class="row" style="justify-content:space-between;padding:7px 0;font-size:14px"><span class="mute">${k}</span><b style="font-variant-numeric:tabular-nums">${v}</b></div>`).join("")}
  <hr style="border:0;border-top:1px solid var(--line);margin:8px 0"><div class="row" style="justify-content:space-between"><b>${a.side==="buy"?"Total dibayar":"Total diterima"}</b><b style="font-size:19px;font-variant-numeric:tabular-nums">${rp(net)}</b></div></div>
  <div class="note info" style="margin:12px 0"><span>📄</span><span>${S.google?"Akan ditulis sebagai baris baru di tab <b>Saham</b> pada spreadsheet Anda.":"Disimpan di Djiwa Pay. Ditulis ke spreadsheet setelah Google terhubung."}</span></div>
  <button class="btn acc" onclick="saveTrade()">Simpan transaksi</button></div>`}
 return `<div class="pad" style="padding-top:80px;text-align:center"><div style="font-size:66px;animation:pop .6s cubic-bezier(.3,1.6,.5,1)">✅</div><h2 style="font-size:24px;margin:10px 0 4px;letter-spacing:-.03em">Tercatat</h2><p class="mute" style="font-size:13px;margin:0 0 20px">${a.msg}</p>
  <div class="group" style="text-align:left"><div class="prog on done"><i>✓</i>Disimpan di Djiwa Pay</div><div class="prog ${S.google?"on done":""}"><i>${S.google?"✓":""}</i>${S.google?"Ditulis ke Google Sheets":"Menunggu Google terhubung"}</div><div class="prog on done"><i>✓</i>Kekayaan bersih diperbarui</div></div>
  <div style="height:16px"></div><button class="btn acc" onclick="S.screen='vault';S.tab='saham';draw()">Lihat di Kekayaan</button><div style="height:8px"></div><button class="btn soft" onclick="S.add={step:1,side:'buy',t:null,lots:'',price:'',q:''};draw()">Catat lagi</button></div>`},

sheet(){const tr=S.trades,hs=holdings(),tab=S.sheetTab;let table;
 if(tab==="Saham")table=`<table><thead><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th></tr></thead><tbody><tr class="h"><td>1</td><td>ID</td><td>Waktu</td><td>Ticker</td><td>Jenis</td><td>Lot</td><td>Harga</td></tr>${tr.map((x,i)=>`<tr><td style="color:#999;text-align:center">${i+2}</td><td style="color:#aaa;font-size:9px">t${i+1}x9</td><td>${x.at}</td><td><b>${x.t}</b></td><td>${x.side==="buy"?"Beli":"Jual"}</td><td class="r">${x.lots}</td><td class="r">${rp(x.price)}</td></tr>`).join("")}</tbody></table>`;
 else table=`<table><thead><tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr></thead><tbody><tr class="h"><td>1</td><td>Ticker</td><td>Lot</td><td>Rata-rata</td><td>Harga</td><td>Nilai</td></tr>${hs.map((h,i)=>{const r=i+2,na=S.price==="na"&&h.t==="GOTO";return `<tr><td style="color:#999;text-align:center">${r}</td><td><b>${h.t}</b></td><td class="r f" onclick="fxs('=SUMIFS(Saham!E:E,Saham!C:C,A${r},Saham!D:D,&quot;Beli&quot;)-SUMIFS(…Jual)')">${h.sh/100}</td><td class="r f" onclick="fxs('Rata-rata beli dihitung aplikasi (rata-rata tertimbang)')">${rp(h.avg)}</td><td class="r f sel" onclick="fxs('=GOOGLEFINANCE(&quot;IDX:&quot;&amp;A${r},&quot;price&quot;)')" ${na?'style="color:#d93025"':""}>${na?"#N/A":rp(h.p)}</td><td class="r f" onclick="fxs('=B${r}*100*D${r}')">${rp(h.value)}</td></tr>`}).join("")}</tbody></table>`;
 return `<div class="gs"><div class="bar2"><button onclick="S.screen='vault';S.tab='saham';draw()" style="font-size:16px">←</button><b style="font-size:12px">Keuangan Djiwa Pay</b><span style="margin-left:auto;font-size:10px;color:#5f6368">Tersimpan di Drive</span></div><div class="fx" id="fx"><span style="color:#80868b">fx</span><span>${S.cell||"Ketuk sel biru di tab Portofolio Saham untuk melihat rumus"}</span></div><div style="overflow:auto;height:560px">${table}<div style="padding:12px;color:#5f6368;font-size:11px;line-height:1.5">Tab <b>Portofolio Saham</b> dihitung otomatis. Catat transaksi lewat aplikasi.</div></div>
 <div class="tabs"><button class="${tab==="Saham"?"on":""}" onclick="S.sheetTab='Saham';S.cell=null;draw()">Saham</button><button class="${tab!=="Saham"?"on":""}" onclick="S.sheetTab='Portofolio Saham';S.cell=null;draw()">Portofolio Saham</button><button onclick="toast('Tab lain: Catatan, Aset, dst.')">Catatan</button><button onclick="toast('Tab lain: Catatan, Aset, dst.')">Aset</button></div></div>`}
};
function fxs(f){S.cell=f.replace(/&quot;/g,'"').replace(/&amp;/g,"&");$("#fx").innerHTML=`<span style="color:#80868b">fx</span><span>${S.cell}</span>`}
function suggHTML(list){return list.map(k=>`<button onclick="S.add.t='${k}';S.add.price='${PRICE[k]??""}';S.add.step=2;draw()">${mini(k)}<div style="flex:1"><b>${k}</b><div class="subt">${TICK[k][0]}</div></div><span class="subt" style="font-variant-numeric:tabular-nums">${PRICE[k]?rp(PRICE[k]):"–"}</span></button>`).join("")||`<div class="mute" style="font-size:13px;padding:16px 4px">Tidak ketemu. Coba kode lain.</div>`}
function sugg(){const q=S.add.q.toUpperCase();$("#sg").innerHTML=suggHTML(Object.keys(TICK).filter(k=>!q||k.includes(q)||TICK[k][0].toUpperCase().includes(q)))}
function sumHTML(a,gross,fee,net,over){return over?`<div class="dn" style="font-size:13px"><b>Lot melebihi kepemilikan.</b></div>`:`<div class="row" style="justify-content:space-between;font-size:13px"><span class="mute">Nilai (${(+a.lots||0)*100} lembar)</span><b style="font-variant-numeric:tabular-nums">${rp(gross)}</b></div><div class="row" style="justify-content:space-between;font-size:13px;margin-top:6px"><span class="mute">Fee ${a.side==="buy"?"beli":"jual"} ${FEE[a.side].toString().replace(".",",")}%</span><b style="font-variant-numeric:tabular-nums">${rp(fee)}</b></div><div class="row" style="justify-content:space-between;margin-top:8px"><b>${a.side==="buy"?"Total":"Diterima"}</b><b style="font-size:18px;font-variant-numeric:tabular-nums">${rp(net)}</b></div>`}
function calc(){const a=S.add,lots=+a.lots||0,price=+a.price||0,gross=lots*100*price,fee=gross*FEE[a.side]/100,net=a.side==="buy"?gross+fee:gross-fee;const held=(holdings().find(h=>h.t===a.t)?.sh||0)/100;const over=a.side==="sell"&&lots>held;$("#sum").innerHTML=sumHTML(a,gross,fee,net,over);$("#go2").disabled=!(lots>0&&price>0&&!over)}
function saveTrade(){const a=S.add;if(!S.trades.length&&a.first)S.trades=[];S.trades.push({t:a.t,side:a.side,lots:+a.lots,price:+a.price,at:"19 Nov 2026"});S.activated=true;
  a.msg=`${a.side==="buy"?"Pembelian":"Penjualan"} ${a.t} ${a.lots} lot @ ${rp(+a.price)} sudah masuk ke portofolio.`;a.step=4;draw()}
function showGoogle(){$("#over").innerHTML=`<div class="over"><div class="sheet"><div class="grab"></div><div style="text-align:center;margin-bottom:10px"><span style="font:700 22px Arial"><span style="color:#4285f4">G</span><span style="color:#ea4335">o</span><span style="color:#fbbc05">o</span><span style="color:#4285f4">g</span><span style="color:#34a853">l</span><span style="color:#ea4335">e</span></span></div>
 <h3 style="text-align:center;margin:0 0 4px;font-size:18px">Djiwa Pay ingin mengakses Akun Google Anda</h3><p class="mute" style="font-size:12px;text-align:center;margin:0 0 12px">fakhri@contoh.com</p>
 <div style="border:1px solid #dadce0;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5"><b>Melihat, mengedit, membuat, dan menghapus hanya file Google Drive tertentu yang Anda gunakan dengan aplikasi ini</b></div>
 <div style="display:flex;gap:10px;margin-top:16px"><button class="btn soft" style="min-height:46px" onclick="$('#over').innerHTML=''">Batal</button><button class="btn" style="min-height:46px;background:#1a73e8" onclick="S.googleBase=true;S.viaConsent=true;S.built=0;S.screen='build';runBuild();draw()">Izinkan</button></div></div></div>`}
function runBuild(){S.built=0;let n=0;const t=setInterval(()=>{n++;S.built=n;if(S.screen!=="build"){clearInterval(t);return}S.noanim=true;render();if(n>=4)clearInterval(t)},750)}
function openFee(){$("#over").innerHTML=`<div class="over" onclick="if(event.target===this)$('#over').innerHTML=''"><div class="sheet"><div class="grab"></div><h3 style="margin:0 0 4px;font-size:20px;letter-spacing:-.03em">Fee broker</h3><p class="mute" style="font-size:12.5px;margin:0 0 14px;line-height:1.45">Berlaku untuk transaksi berikutnya. Jual sudah termasuk pajak penghasilan final 0,1%.</p>
 <div style="display:flex;gap:10px"><label class="field" style="flex:1"><span class="l">Fee beli</span><div class="row"><input id="fb" inputmode="decimal" value="${FEE.buy.toString().replace(".",",")}"><span class="u">%</span></div></label><label class="field" style="flex:1"><span class="l">Fee jual</span><div class="row"><input id="fs" inputmode="decimal" value="${FEE.sell.toString().replace(".",",")}"><span class="u">%</span></div></label></div>
 <div class="chips" style="margin-bottom:12px">${[["Standar","0,15","0,35"],["Tanpa fee","0","0"]].map(([n,b,s])=>`<button style="background:#efe8d8;padding:7px 12px;border-radius:99px;font-weight:700;font-size:12px" onclick="$('#fb').value='${b}';$('#fs').value='${s}'">${n}</button>`).join("")}</div>
 <button class="btn acc" onclick="FEE.buy=parseFloat($('#fb').value.replace(',','.'))||0;FEE.sell=parseFloat($('#fs').value.replace(',','.'))||0;$('#over').innerHTML='';toast('Fee disimpan')">Simpan</button></div></div>`}
function openManual(t){$("#over").innerHTML=`<div class="over" onclick="if(event.target===this)$('#over').innerHTML=''"><div class="sheet"><div class="grab"></div><h3 style="margin:0 0 4px;font-size:20px;letter-spacing:-.03em">Harga manual ${t}</h3><p class="mute" style="font-size:12.5px;margin:0 0 14px;line-height:1.45">Google tidak punya data harga saham ini. Isi sendiri, dan ubah kapan saja.</p>
 <label class="field"><span class="l">Harga per lembar</span><div class="row"><span class="u">Rp</span><input id="mp" inputmode="numeric" value="${S.manual[t]??""}" placeholder="0"></div></label>
 <button class="btn acc" onclick="S.manual['${t}']=+($('#mp').value.replace(/\\D/g,''))||undefined;draw();toast('Harga manual disimpan')">Simpan</button></div></div>`}

draw();
</script>
</body>
