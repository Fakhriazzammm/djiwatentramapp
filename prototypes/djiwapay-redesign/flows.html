<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Djiwa Pay — semua layar</title>
<style>
:root{--ink:#14161c;--mute:#6b7080;--navy:#0f2347;--blue:#1a5dc6}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 -apple-system,"SF Pro Text",Inter,system-ui,sans-serif;background:#eceef4;color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:rgba(236,238,244,.9);backdrop-filter:blur(12px);padding:16px 28px;border-bottom:1px solid #dde0ea;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font-size:20px;letter-spacing:-.02em}header p{margin:0;color:var(--mute);font-size:13px}header a{margin-left:auto;background:var(--navy);color:#fff;text-decoration:none;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px}
main{padding:8px 28px 60px;max-width:1700px;margin:auto}
h2{margin:34px 0 14px;font-size:17px;color:var(--navy);display:flex;align-items:center;gap:10px}h2 small{font-weight:500;color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:22px}
.card{display:block;text-decoration:none;color:inherit}
.shot{position:relative;width:195px;height:422px;border-radius:26px;overflow:hidden;box-shadow:0 0 0 5px #14161c,0 14px 30px rgba(20,22,28,.18);background:#fff;transition:transform .2s}
.card:hover .shot{transform:translateY(-4px)}
.shot iframe{position:absolute;left:0;top:0;width:390px;height:844px;border:0;transform:scale(.5);transform-origin:0 0;pointer-events:none}
.meta{margin:14px 4px 0;font-weight:600;font-size:13.5px;line-height:1.25;max-width:195px}
.t{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
.baru{background:#e5f5ec;color:#13804a}.ubah{background:#e6efff;color:#1a5dc6}.ada{background:#eceef3;color:#4a5163}
</style></head><body>
<header><div><h1>Djiwa Pay — semua layar</h1><p id="cnt"></p></div><a href="index.html">Buka prototipe interaktif →</a></header>
<main id="m"></main>
<script src="screens-list.js"></script>
<script>
let n=0;document.getElementById("m").innerHTML=SCREEN_LIST.map(([g,items])=>{n+=items.length;return `<h2>${g} <small>${items.length} layar</small></h2><div class="grid">${items.map(([k,l,st])=>`<a class="card" href="index.html?s=${k}"><div class="shot"><iframe loading="lazy" src="index.html?embed=1&s=${k}" title="${l}"></iframe></div><div class="meta">${l}<br><span class="t ${st}">${st==="baru"?"Baru":st==="ubah"?"Didesain ulang":"Gaya baru"}</span></div></a>`).join("")}</div>`}).join("");
document.getElementById("cnt").textContent=n+" layar, sheet, dan state · Baru = belum ada di app saat ini · Didesain ulang = sudah ada, tampilan dirombak";
</script></body></html>
