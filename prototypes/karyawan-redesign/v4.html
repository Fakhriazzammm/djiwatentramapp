<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Karyawan v4 — Djiwa Soft iOS (lapang)</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#14161c;--mute:#6b7080;--faint:#9aa0ae;--line:#e8eaf0;--soft:#f0f2f6;--blue:#1a5dc6;--bls:#e8f0fc;--ok:#13804a;--oks:#e5f5ec;--warn:#a05d00;--ws:#fff3dc;--red:#d23a2a;--reds:#fdecea;--r:20px;--rs:14px;--sh:0 1px 2px rgba(20,22,28,.05),0 8px 24px rgba(20,22,28,.05);--ease:cubic-bezier(.32,.72,0,1);--sans:-apple-system,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%}
body{font:15px/1.45 var(--sans);color:var(--ink);background:#d9dce4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;transition:transform .16s var(--ease),background .2s,opacity .2s}button:active{transform:scale(.97)}
.stage{display:grid;grid-template-columns:300px 420px;gap:28px;justify-content:center;align-items:center;height:100%;padding:20px}
.ctl{background:#14161c;color:#c9cdd8;border-radius:18px;padding:18px;font:12px/1.5 var(--sans);max-height:calc(100% - 20px);overflow:auto}
.ctl h3{margin:0 0 4px;font:600 14px var(--sans);color:#fff}.ctl p{margin:0 0 14px;color:#8b90a0}
.ctl b{display:block;margin:14px 0 6px;font:600 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:#7f8596}
.seg{display:flex;flex-wrap:wrap;gap:4px}.seg button{background:#242733;color:#c9cdd8;border-radius:8px;padding:6px 10px;font-size:12px}.seg button.on{background:#fff;color:#14161c;font-weight:600}
.phone{position:relative;width:390px;height:844px;max-height:calc(100vh - 40px);background:var(--bg);border-radius:46px;box-shadow:0 0 0 10px #14161c,0 30px 80px rgba(20,22,28,.35);overflow:hidden;display:flex;flex-direction:column}
.sb{height:44px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font:600 14px var(--sans);background:var(--bg);z-index:3}
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:0 16px 110px}.screen::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:end;padding:8px 8px 22px;background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line)}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);font:500 11px var(--sans);position:relative}.tb img{width:26px;height:26px;object-fit:contain;filter:grayscale(1);opacity:.55;transition:.2s}.tb.on{color:var(--blue)}.tb.on img{filter:none;opacity:1}
.tb .bd{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font:600 10px/16px var(--sans);text-align:center;padding:0 4px}
.fab{width:64px;height:64px;margin:0 auto;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;transform:translateY(-14px);box-shadow:0 10px 26px rgba(20,22,28,.35);position:relative}
.fab.in{background:var(--blue)}.fab.out{background:var(--red)}.fab.done{background:var(--ok)}
.fab svg{width:26px;height:26px}.fabl{display:block;text-align:center;font:600 11px var(--sans);margin-top:-8px;color:var(--ink)}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hdr{display:flex;align-items:center;gap:12px;padding:10px 0 14px}.hdr .t{flex:1;min-width:0}.hdr small{display:block;color:var(--mute);font-size:13px}.hdr h1{margin:0;font:700 24px/1.15 var(--sans);letter-spacing:-.02em}
.av{width:44px;height:44px;border-radius:50%;background:var(--bls);color:var(--blue);display:grid;place-items:center;font:700 16px var(--sans);flex:none}
.rb{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line);position:relative;flex:none}.rb .bd{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font:600 10px/18px var(--sans);text-align:center;padding:0 4px;border:2px solid var(--bg)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px}.card+.card,.sec+.card,.card+.sec{margin-top:12px}
.sec{margin:20px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}.sec h2{margin:0;font:700 17px var(--sans);letter-spacing:-.01em}.sec a{color:var(--blue);font:500 14px var(--sans)}
.hero{background:var(--ink);color:#fff;border-radius:24px;padding:18px;position:relative;overflow:hidden}.hero.in{background:linear-gradient(160deg,#1a5dc6,#123f8a)}.hero.ok{background:linear-gradient(160deg,#13804a,#0d5c34)}
.hero small{color:rgba(255,255,255,.7);font-size:13px}.hero h3{margin:2px 0 0;font:700 22px/1.2 var(--sans);letter-spacing:-.02em}
.hero img.i3{position:absolute;right:-6px;top:-6px;width:112px;height:112px;object-fit:contain;opacity:.95}
.timer{font:700 38px/1.1 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:10px 0 2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.16);font:500 12px var(--sans)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:15px;font:600 16px var(--sans);background:#fff;color:var(--ink);width:100%;margin-top:14px}
.btn.p{background:var(--blue);color:#fff}.btn.k{background:var(--ink);color:#fff}.btn.r{background:var(--red);color:#fff}.btn.g{background:var(--soft);color:var(--ink)}.btn.s{min-height:40px;font-size:14px;width:auto;margin:0;padding:0 14px;border-radius:12px}
.btn:disabled{opacity:.45}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0;padding-top:2px}.row:last-child{padding-bottom:2px}
.row .l{flex:1;min-width:0}.row .l b{display:block;font-weight:600}.row .l span{color:var(--mute);font-size:13px}.row .r{color:var(--mute);font-size:14px;text-align:right}
.row img{width:40px;height:40px;object-fit:contain;flex:none}
.row.tap{cursor:pointer}.chev{width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:2;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:var(--soft);border-radius:14px;padding:10px 12px}.stat b{display:block;font:700 20px var(--sans);letter-spacing:-.02em}.stat span{font-size:12px;color:var(--mute)}
.money{font:700 34px/1.1 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;position:relative}.bar i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .5s var(--ease)}
.tier{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:6px}.tier .on{color:var(--ok);font-weight:600}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font:600 12px var(--sans);background:var(--soft);color:var(--mute)}.tag.ok{background:var(--oks);color:var(--ok)}.tag.w{background:var(--ws);color:var(--warn)}.tag.b{background:var(--bls);color:var(--blue)}.tag.r{background:var(--reds);color:var(--red)}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:16px;background:var(--ws);color:#6b4300;font-size:14px;margin-top:12px}.note.b{background:var(--bls);color:#123f8a}.note b{display:block}
.seg2{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}.seg2 button{flex:1;padding:8px;border-radius:10px;font:600 14px var(--sans);color:var(--mute)}.seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.pill{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}.pill::-webkit-scrollbar{display:none}.pill button{flex:none;padding:8px 14px;border-radius:99px;background:#fff;box-shadow:0 0 0 1px var(--line);font:600 14px var(--sans);color:var(--mute)}.pill button.on{background:var(--ink);color:#fff;box-shadow:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.wd{padding:8px 0;border-radius:14px;position:relative}.wd small{display:block;font:600 11px var(--sans);color:var(--faint);text-transform:uppercase}.wd b{display:block;font:600 17px var(--sans);margin-top:2px}.wd i{display:block;width:6px;height:6px;border-radius:50%;margin:4px auto 0}
.wd.on{background:var(--ink);color:#fff}.wd.on small{color:rgba(255,255,255,.65)}.wd.today b{color:var(--blue)}.wd.on.today b{color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.cal .h{font:600 11px var(--sans);color:var(--faint);padding:6px 0}.cd{padding:8px 0;border-radius:12px;font-weight:500;position:relative}.cd.t{background:var(--bls);color:var(--blue);font-weight:700}.cd i{position:absolute;left:50%;bottom:3px;width:5px;height:5px;border-radius:50%;transform:translateX(-50%)}
.dot-p{background:#2fa66a}.dot-s{background:#e6890e}.dot-g{background:#8b5cf6}.dot-o{background:#aab0bf}
.sheet-bk{position:absolute;inset:0;background:rgba(20,22,28,.4);z-index:10;animation:fi .25s both}.sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;background:#fff;border-radius:28px 28px 0 0;padding:10px 18px 30px;max-height:88%;overflow-y:auto;animation:su .38s var(--ease) both;box-shadow:0 -10px 40px rgba(20,22,28,.2)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#d7dae2;margin:0 auto 14px}.sheet h2{margin:0 0 4px;font:700 22px var(--sans);letter-spacing:-.02em}.sheet p.s{margin:0 0 14px;color:var(--mute)}
@keyframes fi{from{opacity:0}}@keyframes su{from{transform:translateY(100%)}}@keyframes pop{from{transform:scale(.6);opacity:0}}
.steps{display:grid;gap:8px;margin:12px 0}.step{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--soft);color:var(--mute)}.step span{width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;font:700 13px var(--sans);flex:none}.step.cur{background:var(--ws);color:var(--warn)}.step.ok{background:var(--oks);color:var(--ok)}.step.ok span{background:var(--ok);color:#fff}
.spin{width:14px;height:14px;border:2px solid #d9a24a;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.pin{display:flex;gap:12px;justify-content:center;margin:8px 0 14px}.pin i{width:16px;height:16px;border-radius:50%;background:var(--soft);transition:.2s}.pin i.on{background:var(--ink)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kp button{height:56px;border-radius:16px;background:var(--soft);font:600 22px var(--sans)}.kp button.x{background:none;font-size:15px;color:var(--mute)}
.face{width:190px;height:190px;border-radius:50%;margin:10px auto 14px;border:3px solid var(--blue);display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#e8f0fc,#cfdcf3);position:relative;overflow:hidden}.face:after{content:'';position:absolute;left:0;right:0;height:3px;background:var(--blue);animation:scan 1.6s ease-in-out infinite;opacity:.7}@keyframes scan{0%{top:10%}50%{top:90%}100%{top:10%}}
.ok3{width:84px;height:84px;margin:6px auto 10px;display:block;animation:pop .5s var(--ease) both}
.empty{text-align:center;color:var(--faint);padding:26px 10px}.empty img{width:72px;height:72px;object-fit:contain;display:block;margin:0 auto 8px;opacity:.85}
.inp{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;background:#fff;outline:none;font-size:16px}.inp:focus{border-color:var(--blue)}label.f{display:block;font:600 13px var(--sans);color:var(--mute);margin:14px 0 6px}
.nrow{display:flex;gap:12px;padding:14px;border-radius:18px;background:#fff;box-shadow:var(--sh);margin-bottom:10px;position:relative}.nrow.un:before{content:'';position:absolute;left:6px;top:50%;width:6px;height:6px;border-radius:50%;background:var(--blue);transform:translateY(-50%)}.nrow img{width:44px;height:44px;object-fit:contain;flex:none}.nrow .l{flex:1;min-width:0}.nrow b{display:block}.nrow span{color:var(--mute);font-size:13px}
.title{display:flex;align-items:center;gap:8px;padding:8px 0 12px}.title h1{margin:0;font:700 28px var(--sans);letter-spacing:-.025em;flex:1}.back{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--line);display:grid;place-items:center}
.toast{position:absolute;left:50%;bottom:112px;transform:translateX(-50%) translateY(30px);background:rgba(20,22,28,.94);color:#fff;padding:11px 16px;border-radius:14px;font:500 14px var(--sans);opacity:0;transition:.35s var(--ease);z-index:20;white-space:nowrap}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.lb{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.lb:first-child{border:0}.lb .n{width:26px;font:700 16px var(--sans);color:var(--faint);text-align:center}.lb.me{background:var(--bls);margin:0 -10px;padding:10px;border-radius:14px;border:0}
.dd{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}.dd span{color:var(--mute)}.dd b{font-weight:600;text-align:right}

/* ===== v2 compact ===== */
body{font-size:13px;line-height:1.35}
.screen{padding:0 12px 74px}
.tabbar{grid-template-columns:1fr 1fr 64px 1fr 1fr;padding:4px 6px 16px}

/* ===== v3 · Djiwa Soft iOS (lihat docs/design-system) ===== */
:root{--navy:#0f2347;--blue:#1a5dc6;--bls:#e6efff;--canvas:#f6f7fb;--group:#f1f3f8;--line:#e4e8f1;--r:26px;--sh:none;--sky1:#cfe0ff;--sky2:#e4ecff;--sky3:#f6f7fb}
body{background:#cfd6e6}
.phone{background:var(--canvas)}
.sb{background:linear-gradient(#cfe0ff,#cfe0ff)}
.screen{background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 150px,var(--sky3) 330px);padding:0 14px 96px}
.hdr{padding:6px 0 4px}
.rb{background:rgba(255,255,255,.78);box-shadow:none;backdrop-filter:blur(8px)}
.av{background:rgba(255,255,255,.8);color:var(--navy)}
.tabbar{left:12px;right:12px;bottom:14px;border-radius:32px;border:0;padding:6px 8px;background:rgba(255,255,255,.86);box-shadow:0 10px 30px rgba(15,35,71,.16),0 0 0 1px rgba(15,35,71,.05);grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center}
.tb{border-radius:22px;padding:6px 0}.tb.on{background:var(--bls)}
.fab{width:48px;height:48px;transform:none;background:var(--navy);box-shadow:0 6px 16px rgba(15,35,71,.35)}.fab.in{background:var(--blue)}.fab.out{background:var(--navy)}.fab.done{background:var(--ok)}
.fabl{display:none}
.card{background:var(--group);border-radius:var(--r);padding:10px 14px;box-shadow:none}
.card .card{background:#fff}
.sec h2{font:600 12px var(--sans);color:var(--mute);letter-spacing:.02em;text-transform:none}
.row{border-top:1px solid rgba(15,35,71,.07);padding:9px 0}.row:first-child{border:0}
.row img{width:34px;height:34px;padding:4px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(15,35,71,.04)}
.row .l b{font-weight:600}
.stat{background:#fff;border-radius:20px;padding:9px 11px}.stat b{font-size:16px}
.hero{border-radius:28px;padding:14px 16px;background:linear-gradient(150deg,#ffffff,#e9f0ff 60%,#dfe9ff);color:var(--navy);box-shadow:0 0 0 1px rgba(15,35,71,.05)}
.hero.in{background:linear-gradient(150deg,#fff,#e6efff 55%,#d4e3ff);color:var(--navy)}.hero.ok{background:linear-gradient(150deg,#fff,#e5f6ec 60%,#d2efdf);color:var(--navy)}
.hero small{color:var(--mute)}.hero h3{color:var(--navy)}.hero img.i3{width:84px;height:84px;top:2px;right:2px}
.timer{color:var(--navy)}
.hero .btn,.btn.k,.btn.p{background:var(--navy);color:#fff}
.btn{border-radius:99px;background:var(--navy);color:#fff}.btn.g{background:#fff;color:var(--navy);box-shadow:0 0 0 1px var(--line)}.btn.r{background:var(--red)}
.hero .btn{background:var(--navy);color:#fff}
.chip{background:rgba(15,35,71,.07);color:var(--navy)}
.note{border-radius:22px}
.bar{background:rgba(15,35,71,.08);height:8px}.bar i{background:linear-gradient(90deg,#4f8df0,var(--blue))}
.seg2,.pill{}.seg2{background:rgba(255,255,255,.7);border-radius:99px;padding:3px}.seg2 button{border-radius:99px}
.pill button{box-shadow:none;background:rgba(255,255,255,.8)}.pill button.on{background:var(--navy)}
.tag{background:#fff}.tag.ok{background:var(--oks)}.tag.w{background:var(--ws)}.tag.b{background:var(--bls)}.tag.r{background:var(--reds)}
.money{font-size:34px;letter-spacing:-.035em;color:var(--navy)}

function render(){
 const main=S.sub?pSub():S.page==='home'?pHome():S.page==='jadwal'?pJadwal():S.page==='gaji'?pGaji():S.page==='notif'?pNotif():pProfil();
 const sc=$('screen'),top=sc.scrollTop;sc.innerHTML=main;if(S.keep)sc.scrollTop=top;
 $('tabbar').style.display=(S.sub==='closing'||S.page==='notif'&&false)?'none':'';

 const L=$('layer');L.innerHTML=S.sheet?`<div class="sheet-bk" data-act="closesheet"></div><div class="sheet" id="sheet">${S.sheet==='absen'?sheetAbsen():S.sheet==='pin'?sheetPin():S.sheet==='face'?sheetFace():sheetEdit()}</div>`:'';
 ctl()}
function ctl(){const seg=(id,items,key)=>{$(id).innerHTML=items.map(i=>`<button class="${S[key]===i[0]?'on':''}" data-c="${key}|${i[0]}">${i[1]}</button>`).join('')};
 seg('c-att',[['none','Belum masuk'],['work','Bekerja'],['done','Selesai']],'att');seg('c-day',[['kerja','Hari kerja'],['libur','Libur']],'day');seg('c-pin',[['default','PIN default'],['ok','PIN aman']],'pin');seg('c-slip',[['ada','Slip ada'],['belum','Belum']],'slip');
 $('c-jump').innerHTML=[['home','Beranda'],['jadwal','Jadwal'],['gaji','Gaji'],['profil','Profil'],['notif','Notifikasi'],['sub:izin','Izin'],['sub:rekap','Rekap'],['sub:slip','Slip'],['sub:closing','Closing'],['sheet:absen','Sheet absen'],['sub:lb','Leaderboard']].map(j=>`<button data-jump="${j[0]}">${j[1]}</button>`).join('')}

/* ===== events ===== */
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-act],[data-sub],[data-back],[data-jsel],[data-jtab],[data-jview],[data-gm],[data-nf],[data-nread],[data-sheet],[data-iz],[data-ct],[data-k],[data-c],[data-jump]');if(!t)return;
 const d=t.dataset;
 if(d.c){const[k,v]=d.c.split('|');S[k]=v;if(k==='att'){S.closed=false;S.opd=S.bsd=false;S.secs=S.att==='work'?3*3600+44*60:0}render();return}
 if(d.jump){const j=d.jump;S.sheet=null;S.sub=null;if(j.startsWith('sub:')){S.sub=j.slice(4);if(S.sub==='closing'){S.att='work'}}else if(j.startsWith('sheet:')){S.page='home';S.sheet='absen';S.step=0}else S.page=j;render();return}
 if(d.go){S.sub=null;S.page=d.go;S.keep=false;render();$('screen').scrollTop=0;return}
 if(d.sub){S.sub=d.sub;render();$('screen').scrollTop=0;return}
 if(d.back!==undefined){if(S.sub){S.sub=null}else S.page='home';render();return}
 if(d.jsel){S.jSel=+d.jsel;S.keep=true;render();return}if(d.jtab){S.jTab=d.jtab;render();return}if(d.jview!==undefined){S.jView=S.jView==='minggu'?'bulan':'minggu';render();return}
 if(d.gm){S.gMonth=d.gm;render();return}if(d.nf){S.nF=d.nf;render();return}
 if(d.nread){const n=S.notif.find(x=>x.id==d.nread);if(n)n.un=false;render();return}
 if(d.sheet){S.sheet=d.sheet;render();return}
 if(d.iz){S.izType=d.iz;render();return}if(d.ct){S.closeTab=d.ct;render();return}
 if(d.k){if(d.k==='c')S.pinv=S.pinv.slice(0,-1);else if(S.pinv.length<6)S.pinv+=d.k;render();if(S.pinv.length===6){setTimeout(()=>{S.step=2;S.pinv='';render()},350)}return}
 const a=d.act;
 if(a==='absen'){if(S.att==='done'){toast('Shift hari ini sudah selesai');return}S.sheet='absen';S.step=0;S.pinv='';render()}
 else if(a==='verify'){S.vm=d.m;S.step=1;render();if(d.m==='face')setTimeout(()=>{S.step=2;render()},1800)}
 else if(a==='closesheet'){const was=S.step===2&&S.sheet==='absen';S.sheet=null;if(was){S.att=S.att==='none'?'work':'done';S.secs=S.att==='work'?5:0;S.step=0;S.closed=false}render()}
 else if(a==='gotoclose'){S.sheet=null;S.sub='closing';render()}
 else if(a==='opdone'){S.opd=true;S.closeTab='bersih';render();toast('Opname tersimpan')}
 else if(a==='bsdone'){S.bsd=true;render();toast('Checklist tersimpan')}
 else if(a==='closesend'){S.closed=true;S.sub=null;S.page='home';S.sheet='absen';S.step=0;render();toast('Closing terkirim')}
 else if(a==='hide'){S.hide=!S.hide;render()}
 else if(a==='readall'){S.notif.forEach(n=>n.un=false);render()}
 else if(a==='izsend'){S.izSent=true;render()}else if(a==='izreset'){S.izSent=false;S.sub=null;render();toast('Pengajuan terkirim ke Manager')}
 else if(a==='pinsave'){S.pin='ok';S.sheet=null;render();toast('PIN diganti')}
 else if(a==='facesave'){S.sheet=null;render();toast('Wajah terdaftar')}else if(a==='editsave'){S.sheet=null;render();toast('Data tersimpan')}
 else if(a==='pdf'||a==='disp')toast(a==='pdf'?'PDF diunduh':'Koreksi dikirim ke Manager');else if(a==='logout')toast('Keluar (prototipe)');
});
