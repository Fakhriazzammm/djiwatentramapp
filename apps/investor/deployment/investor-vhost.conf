# Static Investor SPA vhost. Certbot adds the HTTPS server after the HTTP site is enabled.
server {
    listen 80;
    listen [::]:80;
    server_name investor.yumme.id;

    root /var/www/investor.yumme.id;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
