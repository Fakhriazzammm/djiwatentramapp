server {
    server_name djiwatentram.yumme.id;
    root /var/www/djiwatentram.yumme.id;
    index index.html;

    client_max_body_size 10m;

    location /api/auth/ {
        proxy_pass http://localhost:3001/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Public images are versioned/slow-changing and should not be re-downloaded on every visit.
    location ~* \.(?:png|jpg|jpeg|webp|gif|svg|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/djiwatentram.yumme.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/djiwatentram.yumme.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = djiwatentram.yumme.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name djiwatentram.yumme.id;

    listen 80;
    return 404; # managed by Certbot


}
