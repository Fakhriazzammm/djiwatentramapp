server {
    server_name djiwatentram.web.id;
    root /var/www/djiwatentram.web.id;
    index index.html;

    client_max_body_size 10m;

    # Customer Community: keep requests same-origin so customer session cookies reach the Worker.
    location ^~ /api/customer-community/ {
        rewrite ^/api/customer-community/(.*)$ /$1 break;
        proxy_pass https://djiwa-customer-community.zantaratechnology.workers.dev;
        proxy_ssl_server_name on;
        proxy_ssl_name djiwa-customer-community.zantaratechnology.workers.dev;
        proxy_set_header Host djiwa-customer-community.zantaratechnology.workers.dev;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

    # Customer Stories: same-origin proxy so the .djiwatentram.web.id session cookie reaches the Worker.
    location ^~ /api/customer-stories/ {
        rewrite ^/api/customer-stories/(.*)$ /$1 break;
        proxy_pass https://djiwa-customer-stories.zantaratechnology.workers.dev;
        proxy_ssl_server_name on;
        proxy_ssl_name djiwa-customer-stories.zantaratechnology.workers.dev;
        proxy_set_header Host djiwa-customer-stories.zantaratechnology.workers.dev;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

    location /api/auth/ {
        proxy_pass http://localhost:3001/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/kol/ {
        proxy_pass http://localhost:3001/api/kol/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location /api/customer/ {
        proxy_pass http://localhost:3001/api/customer/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Public images are versioned/slow-changing and should not be re-downloaded on every visit.
    location ~* \.(?:png|jpg|jpeg|webp|gif|svg|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/djiwatentram.web.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/djiwatentram.web.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = djiwatentram.web.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name djiwatentram.web.id;

    listen 80;
    return 404; # managed by Certbot


}
