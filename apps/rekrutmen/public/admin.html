<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Rekrutmen — Djiwa Tentram</title>
<link rel="icon" type="image/png" href="/logo-djiwa.png" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #1f5eff;
  --primary-soft: #eef4ff;
  --primary-border: #cfe0ff;
  --text: #172033;
  --muted: #6d7992;
  --bg: #f5f7fb;
  --card: #ffffff;
  --line: #dde5f0;
  --soft: #f8fbff;
  --success: #17854b;
  --warning: #c57f0d;
  --danger: #cb4040;
  --purple: #6f52d9;
  --shadow: 0 14px 34px rgba(17, 53, 127, 0.07);
  --radius: 16px;
  --radius-lg: 22px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
}
a { color: inherit; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }

.nav {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(221,229,240,0.95);
}
.nav-inner {
  max-width: 1380px;
  margin: 0 auto;
  height: 64px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.brand svg { width: 32px; height: 32px; }
.brand img { width: 32px; height: 32px; flex-shrink: 0; object-fit: contain; border-radius: 6px; }
.nav-links { display: flex; gap: 8px; }
.nav-link {
  min-height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 12px;
  border-radius: 999px;
  text-decoration: none;
  font-size: 12px;
  font-weight: 800;
  color: var(--muted);
}
.nav-link.active,
.nav-link:hover {
  background: var(--primary-soft);
  color: var(--primary);
}

.page {
  max-width: 1380px;
  margin: 0 auto;
  padding: 14px 16px 24px;
}
.card,
.modal,
.drawer {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
}

.summary {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.stat {
  padding: 12px 14px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: white;
}
.stat-label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.stat-value {
  margin-top: 6px;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.03em;
}

.workspace {
  padding: 14px;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.topbar-title {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.03em;
}
.tab-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.tab {
  min-height: 34px;
  padding: 0 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: white;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
}
.tab.active,
.tab:hover {
  background: var(--primary-soft);
  border-color: var(--primary-border);
  color: var(--primary);
}
.tab .count { margin-left: 5px; opacity: 0.7; }

.toolbar {
  display: grid;
  grid-template-columns: minmax(200px, 1fr) repeat(4, auto);
  gap: 8px;
  margin-bottom: 10px;
}
.search,
.tool-select,
.tool-btn {
  min-height: 38px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: white;
  font-size: 12px;
}
.search {
  position: relative;
  display: flex;
  align-items: center;
}
.search input {
  width: 100%;
  height: 100%;
  border: none;
  outline: none;
  background: transparent;
  padding: 0 12px 0 34px;
  color: var(--text);
}
.search-icon {
  position: absolute;
  left: 12px;
  color: var(--muted);
  font-size: 13px;
}
.tool-select {
  padding: 0 10px;
  outline: none;
  color: var(--text);
}
.tool-btn {
  padding: 0 12px;
  color: var(--muted);
  font-weight: 800;
}
.tool-btn:hover,
.filter-chip:hover {
  background: var(--primary-soft);
  border-color: var(--primary-border);
  color: var(--primary);
}

.filter-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.filter-chip {
  min-height: 32px;
  padding: 0 10px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: white;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
}
.filter-chip.active {
  background: var(--primary-soft);
  border-color: var(--primary-border);
  color: var(--primary);
}

.meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 10px;
  font-size: 11px;
  color: var(--muted);
}
.meta-row strong { color: var(--text); }

.table-shell {
  border: 1px solid var(--line);
  border-radius: 18px;
  overflow: hidden;
  background: white;
}
.table-scroll {
  overflow-x: auto;
  overflow-y: auto;
  max-height: 72vh;
  -webkit-overflow-scrolling: touch;
}
table {
  width: 100%;
  min-width: 1120px;
  border-collapse: separate;
  border-spacing: 0;
  table-layout: fixed;
}
thead th {
  position: sticky;
  top: 0;
  z-index: 3;
  background: #f8fbff;
  border-bottom: 1px solid var(--line);
  padding: 10px 10px;
  text-align: left;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
tbody td {
  padding: 10px 10px;
  border-bottom: 1px solid #edf1f6;
  vertical-align: top;
  font-size: 12px;
  background: white;
}
tbody tr:hover td { background: #fcfdff; }
.sticky-col {
  position: sticky;
  left: 0;
  z-index: 2;
  background: inherit;
  box-shadow: 1px 0 0 #eef2f7;
}
.row-title {
  font-size: 12px;
  font-weight: 800;
  line-height: 1.45;
}
.row-sub {
  margin-top: 4px;
  font-size: 11px;
  color: var(--muted);
  line-height: 1.5;
}
.inline-stack { display: grid; gap: 4px; }
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 24px;
  padding: 0 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 800;
  white-space: nowrap;
}
.badge::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 999px;
  background: currentColor;
  opacity: 0.65;
}
.status-new { background: #edf4ff; color: #265fcb; }
.status-review { background: #fff5df; color: #b97200; }
.status-interview { background: #efebff; color: #6648d8; }
.status-accepted { background: #e9fff2; color: #167a47; }
.status-rejected { background: #ffeaea; color: #c93d3d; }
.status-scheduled { background: #edf4ff; color: #265fcb; }
.status-passed { background: #e9fff2; color: #167a47; }
.status-failed { background: #ffeaea; color: #c93d3d; }
.status-inprogress { background: #fff5df; color: #a56a00; }
.status-completed { background: #e9fff2; color: #167a47; }
.meta-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 5px;
}
.meta-chip {
  display: inline-flex;
  align-items: center;
  min-height: 20px;
  padding: 0 7px;
  border-radius: 999px;
  background: #f4f7fb;
  border: 1px solid #e5ebf3;
  color: #5d6981;
  font-size: 10px;
  font-weight: 800;
}
.rating {
  color: #d68a00;
  font-size: 12px;
  letter-spacing: 0.08em;
}
.row-actions {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}
.small-btn {
  min-height: 28px;
  padding: 0 9px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: white;
  font-size: 10px;
  font-weight: 800;
  color: var(--muted);
}
.small-btn.success { background: var(--success); border-color: var(--success); color: white; }
.small-btn:hover { opacity: 0.92; }

.empty {
  padding: 32px 18px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
}
.empty strong {
  display: block;
  margin-bottom: 6px;
  color: var(--text);
}

.mobile-cards {
  display: none;
  gap: 10px;
}
.mobile-card {
  border: 1px solid var(--line);
  border-radius: 16px;
  background: white;
  padding: 12px;
}
.mobile-card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}
.mobile-card-grid {
  display: grid;
  gap: 8px;
}
.mobile-field {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
}
.mobile-label {
  flex: 0 0 92px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.mobile-value {
  min-width: 0;
  text-align: right;
  font-size: 12px;
  line-height: 1.5;
}
.mobile-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.modal-overlay,
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.34);
  display: none;
}
.modal-overlay.visible,
.drawer-overlay.visible { display: block; }
.modal-wrap {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 14px;
  z-index: 90;
}
.modal-wrap.visible { display: flex; }
.modal {
  width: min(460px, 100%);
  padding: 18px;
}
.modal-title { font-size: 18px; font-weight: 800; }
.modal-subtitle { margin-top: 4px; font-size: 12px; color: var(--muted); }
.modal-grid {
  display: grid;
  gap: 12px;
  margin-top: 14px;
}
.modal label {
  display: block;
  margin-bottom: 5px;
  font-size: 11px;
  font-weight: 800;
}
.modal select,
.modal textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  background: white;
  outline: none;
}
.modal textarea { min-height: 96px; resize: vertical; }
.modal-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 14px;
}
.btn-primary,
.btn-secondary {
  min-height: 38px;
  padding: 0 12px;
  border-radius: 11px;
  border: 1px solid var(--line);
  font-size: 12px;
  font-weight: 800;
}
.btn-primary {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}
.btn-secondary {
  background: white;
  color: var(--muted);
}
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  width: min(420px, 100vw);
  height: 100vh;
  z-index: 95;
  transform: translateX(100%);
  transition: transform 0.2s ease;
  padding: 16px;
  overflow: auto;
}
.drawer.visible { transform: translateX(0); }
.drawer-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
.drawer-title { font-size: 18px; font-weight: 800; }
.detail-grid { display: grid; gap: 10px; }
.detail-card {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px;
  background: var(--soft);
}
.detail-card h4 {
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--primary);
  margin-bottom: 8px;
}
.detail-item { display: grid; gap: 4px; margin-bottom: 8px; }
.detail-item:last-child { margin-bottom: 0; }
.detail-item strong { font-size: 10px; color: var(--muted); }
.detail-item span { font-size: 12px; line-height: 1.55; }
.toast {
  position: fixed;
  right: 14px;
  bottom: 14px;
  z-index: 100;
  min-width: min(320px, calc(100vw - 28px));
  padding: 12px 14px;
  border-radius: 14px;
  color: white;
  font-size: 12px;
  font-weight: 800;
  opacity: 0;
  transform: translateY(10px);
  transition: 0.18s ease;
  box-shadow: 0 16px 32px rgba(0,0,0,0.15);
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.info { background: var(--primary); }

@media (max-width: 980px) {
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .toolbar { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 720px) {
  .nav-inner {
    height: auto;
    min-height: 58px;
    padding-top: 10px;
    padding-bottom: 10px;
    flex-wrap: wrap;
  }
  .page { padding: 12px 12px 24px; }
  .workspace { padding: 12px; }
  .summary { grid-template-columns: 1fr 1fr; }
  .topbar,
  .meta-row,
  .modal-actions,
  .drawer-head { align-items: stretch; }
  .toolbar { grid-template-columns: 1fr; }
  .tab-row {
    overflow-x: auto;
    flex-wrap: nowrap;
    padding-bottom: 2px;
  }
  .tab { white-space: nowrap; }
  .table-shell { display: none; }
  .mobile-cards { display: grid; }
  .sticky-col {
    position: static;
    left: auto;
    box-shadow: none;
  }
}
</style>
</head>
<body>
<div class="nav">
  <div class="nav-inner">
    <a href="/" class="brand">
      <img src="/logo-djiwa.png" alt="Djiwa Tentram" class="brand-logo">
      <span>Admin Rekrutmen</span>
    </a>
    <div class="nav-links">
      <a class="nav-link" href="/">Lowongan</a>
      <a class="nav-link active" href="/admin.html">Admin</a>
    </div>
  </div>
</div>

<div class="page">
  <section class="summary" id="stats"></section>

  <section class="card workspace">
    <div class="topbar">
      <div class="topbar-title">Pipeline Rekrutmen</div>
      <div class="tab-row" id="tabRow"></div>
    </div>

    <div class="toolbar">
      <div class="search">
        <span class="search-icon">⌕</span>
        <input id="searchInput" placeholder="Cari data..." oninput="renderActiveView()">
      </div>
      <select class="tool-select" id="statusFilter" onchange="renderActiveView()"></select>
      <select class="tool-select" id="sortBy" onchange="renderActiveView()"></select>
      <select class="tool-select" id="densitySelect" onchange="applyDensity()">
        <option value="compact">Compact</option>
        <option value="comfortable">Comfortable</option>
      </select>
      <button class="tool-btn" type="button" onclick="refreshAll()">Refresh</button>
    </div>

    <div class="filter-row" id="quickFilters"></div>

    <div class="meta-row">
      <div><strong id="resultCount">0</strong> data tampil</div>
      <div id="contextLabel">Candidates</div>
    </div>

    <div class="table-shell">
      <div class="table-scroll" id="tableContainer">
        <div class="empty"><strong>Memuat data...</strong><span>Menyiapkan tabel rekrutmen.</span></div>
      </div>
    </div>

    <div class="mobile-cards" id="mobileContainer"></div>
  </section>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)"></div>
<div class="modal-wrap" id="modalWrap">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Update status</div>
    <div class="modal-subtitle" id="modalSubtitle">Ubah status data.</div>
    <input type="hidden" id="modalRecordId">
    <input type="hidden" id="modalTableName">
    <div class="modal-grid">
      <div>
        <label for="modalStatus">Status</label>
        <select id="modalStatus"></select>
      </div>
      <div>
        <label for="modalNotes">Catatan</label>
        <textarea id="modalNotes" placeholder="Catatan singkat..."></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" type="button" onclick="saveStatus()">Simpan</button>
      <button class="btn-secondary" type="button" onclick="closeModal()">Batal</button>
    </div>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<aside class="drawer" id="detailDrawer"></aside>
<div class="toast" id="toast"></div>

<script>
const TAB_CONFIG = {
  candidates: {
    label: 'Candidates',
    tableName: 'Candidates',
    statusField: 'Status',
    defaultSort: 'date_desc',
    searchFields: ['Nama Lengkap', 'Posisi Dilamar', 'Email', 'Nomor Telepon/HP'],
    statusOptions: ['All', 'New', 'Review', 'Interview', 'Accepted', 'Rejected'],
    quickFilters: ['All', 'New', 'Review', 'Interview', 'Accepted', 'Rejected'],
    sortOptions: [
      { value: 'date_desc', label: 'Terbaru' },
      { value: 'date_asc', label: 'Terlama' },
      { value: 'name_asc', label: 'Nama A-Z' },
      { value: 'position_asc', label: 'Posisi A-Z' }
    ]
  },
  interviews: {
    label: 'Interviews',
    tableName: 'Interviews',
    statusField: 'Status',
    defaultSort: 'date_desc',
    searchFields: ['Candidate', 'Interviewer', 'Interview ID', 'Feedback'],
    statusOptions: ['All', 'Scheduled', 'Passed', 'Failed'],
    quickFilters: ['All', 'Scheduled', 'Passed', 'Failed'],
    sortOptions: [
      { value: 'date_desc', label: 'Jadwal terbaru' },
      { value: 'date_asc', label: 'Jadwal terlama' },
      { value: 'interviewer_asc', label: 'Interviewer A-Z' }
    ]
  },
  onboarding: {
    label: 'Onboarding',
    tableName: 'Onboarding',
    statusField: 'Training Completion Status',
    defaultSort: 'date_desc',
    searchFields: ['Employee', 'Onboarding ID', 'Training Schedule', 'Notes'],
    statusOptions: ['All', 'In Progress', 'Completed'],
    quickFilters: ['All', 'In Progress', 'Completed'],
    sortOptions: [
      { value: 'date_desc', label: 'Start terbaru' },
      { value: 'date_asc', label: 'Start terlama' },
      { value: 'employee_asc', label: 'Employee A-Z' }
    ]
  }
};

const state = {
  allData: { candidates: [], interviews: [], onboarding: [] },
  activeTab: 'candidates',
  activeQuickFilter: 'All',
  density: 'compact'
};

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function showToast(message, type = 'info') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = `toast ${type} show`;
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
}

function getRecords(tab) {
  return state.allData[tab] || [];
}

function statusClass(rawStatus) {
  const value = String(rawStatus || 'new').toLowerCase().replace(/\s+/g, '');
  if (value === 'inprogress') return 'status-inprogress';
  if (value === 'completed') return 'status-completed';
  if (value === 'accepted') return 'status-accepted';
  if (value === 'rejected') return 'status-rejected';
  if (value === 'review') return 'status-review';
  if (value === 'interview') return 'status-interview';
  if (value === 'scheduled') return 'status-scheduled';
  if (value === 'passed') return 'status-passed';
  if (value === 'failed') return 'status-failed';
  return 'status-new';
}

function renderStats() {
  const candidates = getRecords('candidates');
  const total = candidates.length;
  const review = candidates.filter((item) => ['New', 'Review'].includes(item.fields.Status)).length;
  const interview = candidates.filter((item) => item.fields.Status === 'Interview').length;
  const accepted = candidates.filter((item) => item.fields.Status === 'Accepted').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-label">Total</div><div class="stat-value">${total}</div></div>
    <div class="stat"><div class="stat-label">Review</div><div class="stat-value">${review}</div></div>
    <div class="stat"><div class="stat-label">Interview</div><div class="stat-value">${interview}</div></div>
    <div class="stat"><div class="stat-label">Diterima</div><div class="stat-value">${accepted}</div></div>
  `;
}

function renderTabs() {
  document.getElementById('tabRow').innerHTML = Object.entries(TAB_CONFIG).map(([key, config]) => {
    const count = getRecords(key).length;
    return `<button class="tab ${state.activeTab === key ? 'active' : ''}" type="button" onclick="switchTab('${key}')">${config.label}<span class="count">${count}</span></button>`;
  }).join('');
}

function switchTab(tab) {
  state.activeTab = tab;
  state.activeQuickFilter = 'All';
  document.getElementById('searchInput').value = '';
  populateToolbars();
  renderTabs();
  renderActiveView();
}

function populateToolbars() {
  const config = TAB_CONFIG[state.activeTab];
  const statusFilter = document.getElementById('statusFilter');
  statusFilter.innerHTML = config.statusOptions.map((item) => `<option value="${escapeHtml(item)}">${escapeHtml(item)}</option>`).join('');
  statusFilter.value = 'All';

  const sortBy = document.getElementById('sortBy');
  sortBy.innerHTML = config.sortOptions.map((item) => `<option value="${item.value}">${escapeHtml(item.label)}</option>`).join('');
  sortBy.value = config.defaultSort;

  document.getElementById('quickFilters').innerHTML = config.quickFilters.map((item) => {
    const active = state.activeQuickFilter === item ? 'active' : '';
    return `<button class="filter-chip ${active}" type="button" onclick="setQuickFilter('${escapeHtml(item)}')">${escapeHtml(item)}</button>`;
  }).join('');
}

function setQuickFilter(value) {
  state.activeQuickFilter = value;
  document.querySelectorAll('#quickFilters .filter-chip').forEach((button) => {
    button.classList.toggle('active', button.textContent === value);
  });
  document.getElementById('statusFilter').value = value;
  renderActiveView();
}

function matchesSearch(record, fields, query) {
  if (!query) return true;
  const haystack = fields.map((field) => String(record.fields[field] || '')).join(' ').toLowerCase();
  return haystack.includes(query);
}

function filterRecords(tab) {
  const config = TAB_CONFIG[tab];
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const statusValue = document.getElementById('statusFilter').value;
  return getRecords(tab).filter((record) => {
    const status = String(record.fields[config.statusField] || '');
    const statusMatch = statusValue === 'All' || status === statusValue;
    return statusMatch && matchesSearch(record, config.searchFields, query);
  });
}

function sortRecords(tab, records) {
  const value = document.getElementById('sortBy').value;
  const items = [...records];
  items.sort((a, b) => {
    const fa = a.fields;
    const fb = b.fields;
    if (value === 'name_asc') return String(fa['Nama Lengkap'] || '').localeCompare(String(fb['Nama Lengkap'] || ''));
    if (value === 'position_asc') return String(fa['Posisi Dilamar'] || '').localeCompare(String(fb['Posisi Dilamar'] || ''));
    if (value === 'interviewer_asc') return String(fa['Interviewer'] || '').localeCompare(String(fb['Interviewer'] || ''));
    if (value === 'employee_asc') return String(fa['Employee'] || '').localeCompare(String(fb['Employee'] || ''));
    const dateField = tab === 'candidates' ? 'Application Date' : tab === 'interviews' ? 'Interview Date' : 'Start Date';
    const ad = new Date(fa[dateField] || 0).getTime();
    const bd = new Date(fb[dateField] || 0).getTime();
    return value === 'date_asc' ? ad - bd : bd - ad;
  });
  return items;
}

function renderActiveView() {
  const tab = state.activeTab;
  const config = TAB_CONFIG[tab];
  const filtered = sortRecords(tab, filterRecords(tab));
  const statusValue = document.getElementById('statusFilter').value;
  document.getElementById('resultCount').textContent = String(filtered.length);
  document.getElementById('contextLabel').textContent = `${config.label} • ${statusValue} • ${document.getElementById('sortBy').selectedOptions[0].textContent}`;

  if (!filtered.length) {
    document.getElementById('tableContainer').innerHTML = '<div class="empty"><strong>Tidak ada data.</strong><span>Coba ubah pencarian atau filter.</span></div>';
    document.getElementById('mobileContainer').innerHTML = '<div class="empty"><strong>Tidak ada data.</strong><span>Coba ubah pencarian atau filter.</span></div>';
    return;
  }

  if (tab === 'candidates') {
    renderCandidatesTable(filtered);
    renderCandidatesMobile(filtered);
  } else if (tab === 'interviews') {
    renderInterviewsTable(filtered);
    renderInterviewsMobile(filtered);
  } else {
    renderOnboardingTable(filtered);
    renderOnboardingMobile(filtered);
  }

  applyDensity();
}

  document.getElementById('modalTitle').textContent = `Update ${config.label}`;
  document.getElementById('modalSubtitle').textContent = `Ubah ${config.statusField}.`;
  document.getElementById('modalStatus').innerHTML = config.statusOptions.filter((item) => item !== 'All').map((item) => `<option value="${escapeHtml(item)}">${escapeHtml(item)}</option>`).join('');
  document.getElementById('modalNotes').value = '';
  document.getElementById('modalOverlay').classList.add('visible');
  document.getElementById('modalWrap').classList.add('visible');
}

function closeModal(event) {
  if (event && event.target && event.target.id !== 'modalOverlay') return;
  document.getElementById('modalOverlay').classList.remove('visible');
  document.getElementById('modalWrap').classList.remove('visible');
}

async function saveStatus() {
  const recordId = document.getElementById('modalRecordId').value;
  const table = document.getElementById('modalTableName').value;
  const status = document.getElementById('modalStatus').value;
  const notes = document.getElementById('modalNotes').value.trim();
  const config = TAB_CONFIG[table];
  const payload = { [config.statusField]: status };
  if (notes) payload.Notes = notes;

  try {
    const response = await fetch(`/api/table/${config.tableName}/${recordId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await response.json();
    if (!response.ok || data.error) {
      throw new Error(data?.error?.message || data?.error || 'Gagal update status');
    }
    closeModal();
    showToast('Status diperbarui.', 'success');
    await refreshAll(false);
  } catch (error) {
    showToast(error.message || 'Gagal update status.', 'error');
  }
}

async function refreshAll(showLoadingToast = true) {
  if (showLoadingToast) showToast('Memuat ulang data...', 'info');
  try {
    const [cRes, iRes, oRes] = await Promise.all([
      fetch('/api/table/Candidates'),
      fetch('/api/table/Interviews'),
      fetch('/api/table/Onboarding')
    ]);
    const [cData, iData, oData] = await Promise.all([cRes.json(), iRes.json(), oRes.json()]);
    state.allData.candidates = cData.records || [];
    state.allData.interviews = iData.records || [];
    state.allData.onboarding = oData.records || [];
    renderStats();
    renderTabs();
    populateToolbars();
    renderActiveView();
    if (showLoadingToast) showToast('Data diperbarui.', 'success');
  } catch (error) {
    document.getElementById('tableContainer').innerHTML = '<div class="empty"><strong>Gagal memuat data.</strong><span>Pastikan server berjalan.</span></div>';
    document.getElementById('mobileContainer').innerHTML = '<div class="empty"><strong>Gagal memuat data.</strong><span>Pastikan server berjalan.</span></div>';
    showToast('Gagal memuat data.', 'error');
  }
}
