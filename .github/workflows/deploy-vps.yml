name: Deploy to VPS
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy all apps to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 43.129.54.5
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/djiwatentramapp
            git pull origin main
            bash scripts/deploy-vps.sh all
