name: Build release artifacts
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        app: [admin, karyawan]
    uses: ./.github/workflows/build-app-artifact.yml
    secrets: inherit
    with:
      app: ${{ matrix.app }}
