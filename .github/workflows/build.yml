name: Validate performance fixes
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun test scripts/tests
      - run: bash -n scripts/deploy-vps.sh scripts/deploy-admin.sh scripts/sync-pos-notifications.sh
      - run: node --check scripts/publish-artifact.mjs
